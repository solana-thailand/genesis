# The URL the site will be built for
base_url = "https://solana-thailand.github.io/genesis/"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# The title of the site
title = "Solana Thailand Genesis"

# Description for SEO
description = "The Digital HQ for Solana Builders in Thailand. Stake, Build, Earn."

# The default language
default_language = "en"


[markdown]
[markdown.highlighting]
theme = "github-dark"

[extra]
# Custom variables
author = "Solana Thailand Core Team"
github_repo = "https://github.com/solana-thailand/genesis"
discord_url = "https://discord.gg/PGbUgNmsns"
# Google Calendar embed URL. This calendar contains ALL Solana Thailand events
# (both in-person and online) — it is embedded on the /events/ page and is
# the canonical schedule for the community.
# Format: https://calendar.google.com/calendar/embed?src=<CALENDAR_ID>&ctz=Asia/Bangkok
# Leave empty to hide the calendar section.
calendar_embed = "https://calendar.google.com/calendar/embed?src=57399435c4dd87f2139dbf21343dfa108185881d205442bb2f96b09de6ba6807%40group.calendar.google.com&ctz=Asia%2FBangkok"
