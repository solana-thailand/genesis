name: check site

# The deploy action only runs on a push to main, so a template that fails to
# build was not discovered until after merge. On 2026-09-12 that meant the site
# had been un-deployable since 17 June without anyone knowing: journey.html
# read `page` in a section context, which zola 0.22 tolerated and 0.23 does not.
# The version here must match the one the deploy action uses.
on:
  pull_request:
    paths: ["docs/**"]
  push:
    branches-ignore: [main]
    paths: ["docs/**"]

env:
  ZOLA_VERSION: "0.23.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zola ${{ env.ZOLA_VERSION }}
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          zola --version
      - name: build
        working-directory: docs
        run: zola build

      - name: every event page states a status the templates understand
        run: |
          fail=0
          for f in docs/content/events/*.md; do
            [ "$(basename "$f")" = "_index.md" ] && continue
            s=$(grep -o 'event_status = "[a-z]*"' "$f" | head -1 | sed 's/.*"\(.*\)"/\1/')
            case "$s" in
              completed|upcoming) ;;
              *) echo "::error file=$f::event_status is '$s'; templates only render completed or upcoming"; fail=1 ;;
            esac
            grep -q '^date = ' "$f" || { echo "::error file=$f::no date, so it cannot be sorted"; fail=1; }
          done
          exit $fail
